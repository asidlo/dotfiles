$schema: "1.0"
name: winget-core
description: Install core developer tools via winget.
parameters:
  Packages:
    type: array
    description: Optional override list of winget-source package ids. A single space-delimited string is also accepted.
    required: false
  DockerDataRoot:
    type: string
    description: Docker Desktop WSL 2 disk location, passed as --wsl-default-data-root on a fresh install only.
    required: false
command: |
  powershell -ExecutionPolicy Bypass -File script.ps1
